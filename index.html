<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exio Lender Dashboard | Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#335789; --navy-deep:#26436E; --navy-ink:#12233c; --navy-tint:rgba(51,87,137,.09);
  --gold:#E1AE53; --gold-dark:#C4933A; --gold-text:#94691C; --gold-soft:#fbf3e3;
  --ink:#1D1D1F; --slate:#6E6E73; --muted:#8a8a90;
  --bg:#ffffff; --bg-light:#F5F5F7; --surface:#ffffff; --divider:#E6E6EA; --field:#ffffff;
  --green:#2f8f57; --green-soft:#e8f3ec; --red:#c2493f; --red-soft:#f8eae8; --amber:#b27a12; --amber-soft:#fbf3e3; --blue-soft:#e8eef7;
  --brand:#1f5c63;
  --side:268px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eef1f6; --slate:#a7aebb; --muted:#8e96a3; --bg:#0e1522; --bg-light:#151f30; --surface:#172238; --divider:#263349; --field:#111a29;
    --navy-deep:#b5c9e8; --navy-tint:rgba(147,179,224,.12); --gold-text:#e7bd6c; --gold-soft:#2a2416;
    --green-soft:#16301f; --red-soft:#35191a; --amber-soft:#2d2412; --blue-soft:#18253a;
  }
}
:root[data-theme="dark"]{
  --ink:#eef1f6; --slate:#a7aebb; --muted:#8e96a3; --bg:#0e1522; --bg-light:#151f30; --surface:#172238; --divider:#263349; --field:#111a29;
  --navy-deep:#b5c9e8; --navy-tint:rgba(147,179,224,.12); --gold-text:#e7bd6c; --gold-soft:#2a2416;
  --green-soft:#16301f; --red-soft:#35191a; --amber-soft:#2d2412; --blue-soft:#18253a;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased; }
h1,h2,h3,h4{ font-family:'Raleway','Open Sans',sans-serif; margin:0; }
p{ margin:0; }
button,input,select,textarea{ font:inherit; color:inherit; }
a{ color:var(--navy); }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:6px; }
[hidden]{ display:none !important; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
svg.i{ width:18px; height:18px; flex-shrink:0; }

/* ---------- layout ---------- */
.app{ display:grid; grid-template-columns:var(--side) 1fr; min-height:100vh; }
.sidebar{ position:sticky; top:0; height:100vh; overflow-y:auto; background:var(--surface); border-right:1px solid var(--divider); display:flex; flex-direction:column; padding:22px 0 16px; }
.s-logo{ padding:2px 26px 18px; border-bottom:1px solid var(--divider); display:flex; align-items:center; gap:10px; }
.s-logo img{ height:28px; width:auto; }
.s-logo .tag{ font-family:'Raleway',sans-serif; font-size:10.5px; font-weight:600; letter-spacing:.8px; color:var(--slate); border:1px solid var(--divider); border-radius:20px; padding:2px 8px; }
.s-firm{ display:flex; align-items:center; gap:12px; padding:6px 22px 18px; border-bottom:1px solid var(--divider); margin-bottom:8px; }
.blogo{ width:40px; height:40px; border-radius:10px; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Raleway',sans-serif; font-weight:700; font-size:14px; letter-spacing:.5px; flex-shrink:0; overflow:hidden; }
.blogo img{ width:100%; height:100%; object-fit:contain; background:#fff; }
.s-firm small{ display:block; font-size:10.5px; color:var(--slate); font-weight:600; letter-spacing:.6px; }
.s-firm b{ display:block; font-family:'Raleway',sans-serif; font-size:14.5px; font-weight:600; line-height:1.3; }
.nav{ padding:6px 14px; display:flex; flex-direction:column; gap:2px; }
.nav .grp{ font-size:10.5px; font-weight:600; letter-spacing:.8px; color:var(--muted); padding:14px 14px 6px; }
.nav button{ display:flex; align-items:center; gap:12px; width:100%; border:0; background:none; text-align:left; padding:10px 14px; border-radius:10px; color:var(--slate); cursor:pointer; font-size:14px; min-height:40px; }
.nav button:hover{ background:var(--bg-light); color:var(--ink); }
.nav button.on{ background:var(--navy-tint); color:var(--navy); font-weight:600; }
:root[data-theme="dark"] .nav button.on{ color:var(--navy-deep); }
.nav .cnt{ margin-left:auto; font-size:11px; font-weight:700; background:var(--gold); color:#12233c; border-radius:10px; padding:1px 7px; }
.s-foot{ margin-top:auto; padding:14px 22px 0; border-top:1px solid var(--divider); display:flex; align-items:center; gap:10px; font-size:13px; color:var(--slate); }
.av{ width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--navy-ink),var(--navy)); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-family:'Raleway',sans-serif; font-weight:600; font-size:12px; flex-shrink:0; }
.av.sm{ width:26px; height:26px; font-size:10.5px; }
.av.gold{ background:linear-gradient(135deg,#94691C,var(--gold)); color:#12233c; }
.main{ padding:44px 56px 100px; min-width:0; }
.main-in{ max-width:1160px; margin:0 auto; }
.banner{ background:var(--amber-soft); color:var(--amber); border:1px solid rgba(178,122,18,.25); border-radius:12px; padding:10px 16px; font-size:12.5px; margin-bottom:26px; }
.top{ display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:30px; }
.top h1{ font-weight:300; font-size:32px; letter-spacing:-.3px; color:var(--navy-deep); line-height:1.15; }
.top .sub{ color:var(--slate); margin-top:6px; font-size:14px; }
.crumb{ font-size:12.5px; color:var(--slate); margin-bottom:8px; }
.crumb button{ border:0; background:none; padding:0; color:var(--navy); cursor:pointer; font-weight:600; }
.btn.menu-btn{ display:none; }
.s-logo .lw{ display:none; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .s-logo .ln{ display:none; } :root:not([data-theme="light"]) .s-logo .lw{ display:block; } }
:root[data-theme="dark"] .s-logo .ln{ display:none; } :root[data-theme="dark"] .s-logo .lw{ display:block; }

/* ---------- primitives ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:40px; padding:0 16px; border-radius:10px; border:1.5px solid transparent; font-family:'Raleway',sans-serif; font-weight:600; font-size:13.5px; cursor:pointer; white-space:nowrap; text-decoration:none; }
.btn svg{ width:16px; height:16px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-navy{ background:var(--navy); color:#fff; } .btn-navy:hover{ background:var(--navy-deep); }
:root[data-theme="dark"] .btn-navy:hover{ background:#3e679f; }
.btn-gold{ background:var(--gold); color:#12233c; } .btn-gold:hover{ background:#e8bb68; }
.btn-line{ background:var(--surface); border-color:var(--divider); color:var(--ink); } .btn-line:hover{ border-color:var(--navy); color:var(--navy); }
.btn-ghost{ background:none; color:var(--navy); padding:0 10px; }
.btn-danger{ background:var(--surface); border-color:rgba(194,73,63,.35); color:var(--red); }
.btn-sm{ min-height:32px; padding:0 12px; font-size:12.5px; border-radius:8px; }
.card{ background:var(--bg-light); border-radius:20px; padding:26px 28px; }
.card.w{ background:var(--surface); border:1px solid var(--divider); }
.card h3{ font-weight:600; font-size:16.5px; }
.card .csub{ color:var(--slate); font-size:13px; margin-top:4px; }
.chead{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
.grid4{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
.stack{ display:flex; flex-direction:column; gap:22px; }
.stat{ border:1px solid var(--divider); border-radius:18px; padding:20px 22px; background:var(--surface); }
.stat .v{ font-family:'Raleway',sans-serif; font-weight:300; font-size:32px; letter-spacing:-.5px; color:var(--navy-deep); line-height:1.1; }
.stat .l{ font-size:12.5px; color:var(--slate); margin-top:4px; }
.hero{ position:relative; overflow:hidden; background:linear-gradient(120deg,#1f3a60,var(--navy)); color:#fff; border-radius:24px; padding:34px 38px; }
.hero .eb{ font-family:'Raleway',sans-serif; font-size:11.5px; letter-spacing:2.2px; font-weight:600; color:#f0c88a; }
.hero .big{ font-family:'Raleway',sans-serif; font-weight:200; font-size:48px; letter-spacing:-1.2px; line-height:1.05; margin-top:8px; }
.hero .hs{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:24px; }
.hero .hs div{ border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); border-radius:14px; padding:14px 16px; }
.hero .hs b{ display:block; font-family:'Raleway',sans-serif; font-weight:300; font-size:26px; }
.hero .hs span{ font-size:12px; color:rgba(255,255,255,.78); }
.pill{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; border-radius:20px; padding:3px 10px; white-space:nowrap; }
.pill.green{ background:var(--green-soft); color:var(--green); }
.pill.amber{ background:var(--amber-soft); color:var(--amber); }
.pill.red{ background:var(--red-soft); color:var(--red); }
.pill.blue{ background:var(--blue-soft); color:var(--navy); }
:root[data-theme="dark"] .pill.blue{ color:var(--navy-deep); }
.pill.gray{ background:var(--bg-light); color:var(--slate); border:1px solid var(--divider); }
.pill.gold{ background:var(--gold); color:#12233c; }
.dot{ width:7px; height:7px; border-radius:50%; background:currentColor; }
.list{ display:flex; flex-direction:column; }
.row{ display:flex; align-items:center; gap:14px; padding:13px 0; border-top:1px solid var(--divider); }
.row:first-child{ border-top:0; }
.row .t{ font-weight:600; font-size:14px; }
.row .s{ font-size:12.5px; color:var(--slate); }
.row .end{ margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.tbl-wrap{ overflow-x:visible; border:1px solid var(--divider); border-radius:16px; background:var(--surface); }
table.tbl{ width:100%; border-collapse:collapse; min-width:0 !important; table-layout:auto; }
.tbl td,.tbl th{ word-break:normal; overflow-wrap:break-word; }
.tbl .thsort{ white-space:nowrap; }
.tbl td.dcol{ min-width:170px; }
.tbl.tight td,.tbl.tight th{ padding:10px 9px; }
.tbl.tight td.num{ font-size:12.5px; }
.tbl.tight .stsel{ max-width:128px; }
.sacts{ display:flex; flex-direction:column; gap:4px; align-items:flex-end; }
.sacts .btn{ white-space:nowrap; }
.tbl .nowrap{ white-space:nowrap; }
.tbl th{ white-space:normal !important; }
.tbl th{ text-align:left; font-size:11.5px; font-weight:600; color:var(--slate); padding:12px 16px; border-bottom:1px solid var(--divider); background:var(--bg-light); white-space:nowrap; }
.tbl td{ padding:13px 16px; border-bottom:1px solid var(--divider); vertical-align:middle; font-size:13.5px; }
.tbl tr:last-child td{ border-bottom:0; }
.tbl tr.dim td{ color:var(--muted); }
.tbl tr.dim .t{ color:var(--muted); }
.tbl .t{ font-weight:600; }
.tbl .s{ font-size:12px; color:var(--slate); }
.tbl tr.click{ cursor:pointer; } .tbl tr.click:hover td{ background:var(--bg-light); }
.num{ font-variant-numeric:tabular-nums; }
.tbl td.num{ white-space:nowrap; }
.fld{ display:flex; flex-direction:column; gap:6px; }
.fld label, .lbl{ font-size:12px; font-weight:600; color:var(--slate); }
.inp, select.inp, textarea.inp{ width:100%; min-height:40px; border:1px solid var(--divider); border-radius:10px; background:var(--field); padding:8px 12px; font-size:13.5px; }
textarea.inp{ min-height:88px; resize:vertical; }
.inp:focus{ outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(51,87,137,.15); }
select.mini{ min-height:32px; border:1px solid var(--divider); border-radius:8px; background:var(--field); padding:4px 8px; font-size:12.5px; }
.fg{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.fg .full{ grid-column:1/-1; }
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--divider); margin-bottom:24px; overflow-x:auto; }
.tabs button{ border:0; background:none; padding:12px 14px; font-family:'Raleway',sans-serif; font-weight:600; font-size:14px; color:var(--slate); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; display:inline-flex; align-items:center; gap:7px; }
.tabs button.on{ color:var(--navy); border-bottom-color:var(--gold); }
:root[data-theme="dark"] .tabs button.on{ color:var(--navy-deep); }
.tabs .cnt{ font-size:11px; font-weight:700; background:var(--gold); color:#12233c; border-radius:10px; padding:0 6px; }
.seg{ display:inline-flex; gap:3px; background:var(--bg-light); border-radius:10px; padding:3px; flex-wrap:wrap; }
.seg button{ border:0; background:none; padding:6px 12px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--slate); cursor:pointer; min-height:32px; }
.seg button.on{ background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08); }
.toggle{ position:relative; width:38px; height:22px; border-radius:20px; border:0; background:var(--divider); cursor:pointer; flex-shrink:0; transition:background .2s; padding:0; }
.toggle::after{ content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .2s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
.toggle[aria-checked="true"]{ background:var(--green); }
.toggle[aria-checked="true"]::after{ transform:translateX(16px); }
.chip{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--divider); border-radius:20px; padding:4px 10px 4px 4px; font-size:12.5px; background:var(--surface); cursor:pointer; min-height:32px; }
.chip.on{ border-color:var(--navy); background:var(--navy-tint); font-weight:600; }
.chip.plain{ padding:4px 10px; }
.empty{ text-align:center; color:var(--slate); padding:30px 12px; border:1px dashed var(--divider); border-radius:14px; }
.note{ font-size:12px; color:var(--slate); }

/* stage tracker */
.stages{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.stage{ position:relative; padding-top:14px; font-size:11.5px; color:var(--slate); text-align:center; }
.stage::before{ content:""; position:absolute; top:0; left:0; right:0; height:5px; border-radius:3px; background:var(--divider); }
.stage.done::before{ background:var(--navy); }
.stage.cur::before{ background:var(--gold); }
.stage.cur{ color:var(--ink); font-weight:700; }
.minibar{ height:6px; border-radius:4px; background:var(--divider); overflow:hidden; width:120px; }
.minibar i{ display:block; height:100%; background:var(--navy); border-radius:4px; }

/* data room */
.dr{ display:grid; grid-template-columns:210px 1fr; gap:22px; align-items:start; }
.folders{ display:flex; flex-direction:column; gap:4px; }
.folder{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:1px solid transparent; background:none; border-radius:12px; padding:10px 12px; cursor:pointer; }
.folder:hover{ background:var(--bg-light); }
.folder.on{ background:var(--surface); border-color:var(--divider); box-shadow:0 1px 3px rgba(0,0,0,.05); }
.folder .fn{ font-weight:600; font-size:13.5px; }
.folder .fm{ font-size:11.5px; color:var(--slate); }
.folder svg{ color:var(--gold-dark); }
.lvl{ font-size:11px; font-weight:700; border-radius:6px; padding:2px 7px; white-space:nowrap; }
.lvl.Public{ background:var(--green-soft); color:var(--green); }
.lvl.Private{ background:var(--amber-soft); color:var(--amber); }
.lvl.Exclusive{ background:var(--blue-soft); color:var(--navy); }
:root[data-theme="dark"] .lvl.Exclusive{ color:var(--navy-deep); }
.lvl.Internal{ background:var(--bg-light); color:var(--slate); border:1px solid var(--divider); }
.lvl.DataRoom{ background:#ece8f7; color:#5b4a99; }
:root[data-theme="dark"] .lvl.DataRoom{ background:#2a2540; color:#c3b6f0; }
.lvl.Seller{ background:var(--red-soft); color:var(--red); }
.drive{ display:flex; align-items:center; gap:14px; border:1px solid var(--divider); border-radius:14px; padding:12px 16px; background:var(--surface); margin-bottom:16px; flex-wrap:wrap; }
.drive .gd{ width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,#1e8e3e 0 33%,#fbbc04 33% 66%,#1a73e8 66%); flex-shrink:0; }
.matrix td{ text-align:center; }
.matrix td:first-child{ text-align:left; }
.pcell{ border:1px solid var(--divider); border-radius:8px; background:var(--surface); font-size:11.5px; font-weight:600; padding:5px 8px; min-width:78px; cursor:pointer; min-height:30px; }
.pcell.none{ color:var(--muted); }
.pcell.view{ background:var(--amber-soft); color:var(--amber); border-color:transparent; }
.pcell.download{ background:var(--blue-soft); color:var(--navy); border-color:transparent; }
.pcell.edit{ background:var(--green-soft); color:var(--green); border-color:transparent; }
.bars{ display:flex; align-items:flex-end; gap:6px; height:140px; padding-top:10px; }
.bars div{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
.bars i{ display:block; width:100%; border-radius:6px 6px 0 0; background:linear-gradient(180deg,#4b73aa,var(--navy)); min-height:2px; }
.bars span{ font-size:10.5px; color:var(--muted); }
.hbar{ height:8px; border-radius:5px; background:var(--divider); overflow:hidden; flex:1; }
.hbar i{ display:block; height:100%; background:linear-gradient(90deg,var(--navy),#4b73aa); border-radius:5px; }
.integ{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.icard{ border:1px solid var(--divider); border-radius:16px; padding:18px; background:var(--surface); display:flex; flex-direction:column; gap:10px; }
.icard .ih{ display:flex; align-items:center; gap:10px; }
.ilogo{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-family:'Raleway',sans-serif; font-weight:700; color:#fff; font-size:13px; flex-shrink:0; }
.cert{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.ccard{ border:1px solid var(--divider); border-radius:16px; padding:18px; background:var(--surface); }
.ccard .ct{ display:flex; align-items:center; gap:10px; font-weight:600; }
.ccard .ct svg{ color:var(--navy); }
.ccard p{ font-size:12.5px; color:var(--slate); margin-top:8px; }
.qa{ border:1px solid var(--divider); border-radius:16px; padding:16px 18px; background:var(--surface); }
.qa + .qa{ margin-top:12px; }
.qa .qh{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:12.5px; color:var(--slate); }
.qa .q{ font-weight:600; margin:8px 0; }
.qa .a{ background:var(--bg-light); border-radius:10px; padding:10px 12px; font-size:13px; }
.msgs{ display:flex; flex-direction:column; gap:12px; max-height:420px; overflow-y:auto; padding:4px 2px 10px; }
.msg{ max-width:78%; border-radius:14px; padding:10px 14px; background:var(--bg-light); }
.msg.me{ align-self:flex-end; background:var(--navy); color:#fff; }
.msg .msgh{ font-size:11.5px; opacity:.75; margin-bottom:3px; }
.msg .att{ display:inline-flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; border-radius:8px; padding:3px 8px; background:rgba(0,0,0,.08); }
.msg.me .att{ background:rgba(255,255,255,.16); }
.compose{ display:flex; gap:10px; margin-top:12px; align-items:flex-end; }
.compose textarea{ min-height:44px; }

/* listing preview + seller dashboard preview */
.lcard{ border:1px solid var(--divider); border-radius:18px; overflow:hidden; background:var(--surface); display:flex; flex-direction:column; }
.lcover{ position:relative; height:150px; background:linear-gradient(120deg,#0f1c30,#25415f 55%,#33506f); color:#fff; padding:16px 18px; display:flex; flex-direction:column; justify-content:space-between; }
.lcover .loc{ font-family:'Raleway',sans-serif; font-size:11px; letter-spacing:1.4px; font-weight:600; color:#d7e2f3; }
.lbody{ padding:18px 20px 20px; display:flex; flex-direction:column; gap:6px; flex:1; }
.lbody .ind{ font-size:11px; font-weight:600; color:var(--gold-text); letter-spacing:.6px; }
.lbody h4{ font-weight:500; font-size:17px; line-height:1.3; }
.lstats{ display:grid; grid-template-columns:repeat(3,1fr); margin-top:10px; border-top:1px solid var(--divider); padding-top:10px; }
.lstats b{ display:block; font-family:'Raleway',sans-serif; font-weight:500; font-size:15px; }
.lstats span{ font-size:11px; color:var(--slate); }
.cobrand{ display:flex; align-items:center; gap:10px; border-top:1px solid var(--divider); padding:12px 20px; font-size:12px; color:var(--slate); background:var(--bg-light); }
.cobrand .blogo{ width:28px; height:28px; border-radius:7px; font-size:10px; }
.cobrand b{ color:var(--ink); }
.sdp{ display:grid; grid-template-columns:230px 1fr; min-height:560px; border:1px solid var(--divider); border-radius:18px; overflow:hidden; background:#fff; color:#1d1d1f; }
.sdp aside{ border-right:1px solid #e6e6ea; padding:18px 0; display:flex; flex-direction:column; }
.sdp .sl{ display:flex; align-items:center; gap:10px; padding:0 18px 14px; border-bottom:1px solid #e6e6ea; }
.sdp .sl b{ font-family:'Raleway',sans-serif; font-size:13.5px; line-height:1.25; }
.sdp .sc{ padding:14px 18px; }
.sdp .sc small{ display:block; font-size:10px; letter-spacing:1.2px; color:#6e6e73; font-weight:600; }
.sdp .sc b{ font-family:'Raleway',sans-serif; font-size:14px; }
.sdp nav{ padding:0 10px; display:flex; flex-direction:column; gap:2px; }
.sdp nav span{ display:flex; align-items:center; gap:10px; font-size:13px; color:#6e6e73; padding:8px 10px; border-radius:9px; }
.sdp nav span.on{ background:rgba(51,87,137,.09); color:#335789; font-weight:600; }
.sdp nav svg{ width:16px; height:16px; }
.sdp .pw{ margin-top:auto; padding:12px 18px 0; border-top:1px solid #e6e6ea; font-size:11px; color:#8a8a90; display:flex; align-items:center; gap:6px; }
.sdp .pw img{ height:14px; }
.sdp main{ padding:26px 30px; background:#fff; }
.sdp main h2{ font-weight:300; font-size:26px; color:#26436E; margin-bottom:18px; }
.sdp .sh{ border-radius:18px; padding:24px 26px; background:linear-gradient(120deg,#1f3a60,#335789); color:#fff; }
.sdp .sh small{ font-family:'Raleway',sans-serif; font-size:10px; letter-spacing:2px; font-weight:600; color:#f0c88a; }
.sdp .sh b{ display:block; font-family:'Raleway',sans-serif; font-weight:200; font-size:40px; letter-spacing:-1px; }
.sdp .sh .ss{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
.sdp .sh .ss div{ border:1px solid rgba(255,255,255,.18); border-radius:12px; padding:10px 12px; }
.sdp .sh .ss b{ font-size:22px; font-weight:300; letter-spacing:0; }
.sdp .sh .ss span{ font-size:11px; opacity:.8; }
.sdp .scards{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px; }
.sdp .scards div{ background:#f5f5f7; border-radius:16px; padding:16px 18px; font-size:12.5px; color:#6e6e73; }
.sdp .scards b{ display:block; font-family:'Raleway',sans-serif; color:#1d1d1f; font-size:14px; margin-bottom:6px; }
.sdp .adv{ display:flex; align-items:center; gap:10px; margin-top:14px; border:1px solid #e6e6ea; border-radius:14px; padding:12px 14px; font-size:12.5px; color:#6e6e73; }
.sdp .adv b{ color:#1d1d1f; }

/* agreement document */
.doc{ background:#fff; color:#1d1d1f; border:1px solid var(--divider); border-radius:14px; padding:30px 34px; font-size:12.5px; line-height:1.7; max-height:560px; overflow-y:auto; }
.doc .dh{ display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #E1AE53; padding-bottom:14px; margin-bottom:18px; gap:14px; }
.doc .dh .blogo{ width:34px; height:34px; font-size:11px; }
.doc h4{ font-family:'Raleway',sans-serif; font-size:17px; font-weight:600; color:#26436E; }
.doc h5{ font-family:'Raleway',sans-serif; font-size:12.5px; font-weight:700; margin:16px 0 4px; color:#26436E; }
.doc .fillv{ background:#fbf3e3; border-radius:4px; padding:0 4px; font-weight:600; }
.doc .sig{ display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:24px; }
.doc .sig div{ border-top:1px solid #1d1d1f; padding-top:6px; font-size:11px; color:#6e6e73; }

/* modal / drawer / toast */
dialog.modal{ border:0; border-radius:20px; padding:0; width:min(760px,calc(100vw - 28px)); max-height:calc(100vh - 40px); background:var(--surface); color:var(--ink); box-shadow:0 30px 80px rgba(0,0,0,.35); }
dialog.modal.wide{ width:min(1180px,calc(100vw - 28px)); }
dialog.modal::backdrop{ background:rgba(15,28,48,.55); }
.mh{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; padding:22px 26px 14px; border-bottom:1px solid var(--divider); position:sticky; top:0; background:var(--surface); z-index:2; }
.mh h2{ font-weight:400; font-size:22px; }
.mh p{ color:var(--slate); font-size:13px; margin-top:4px; }
.mb{ padding:20px 26px; }
.mf{ display:flex; justify-content:flex-end; gap:10px; padding:14px 26px 20px; border-top:1px solid var(--divider); position:sticky; bottom:0; background:var(--surface); }
.x{ width:38px; height:38px; border-radius:50%; border:1px solid var(--divider); background:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.x svg{ width:16px; height:16px; }
.toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px); opacity:0; background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:12px; font-size:13.5px; z-index:200; transition:opacity .25s, transform .25s; pointer-events:none; max-width:calc(100vw - 32px); }
.toast.show{ opacity:1; transform:translate(-50%,0); }
.coowner{ display:grid; grid-template-columns:1fr 1.2fr auto; gap:10px; align-items:end; margin-bottom:10px; }
.ai{ border:1px solid rgba(225,174,83,.45); background:var(--gold-soft); border-radius:12px; padding:10px 12px; font-size:12.5px; }
.ai b{ color:var(--gold-text); }


.prof{ display:grid; grid-template-columns:250px 1fr; gap:24px; align-items:start; }
.prof .side{ display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center; position:sticky; top:90px; }
.bigav{ width:132px; height:132px; border-radius:50%; background:linear-gradient(135deg,var(--navy-ink),var(--navy)); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Raleway',sans-serif; font-weight:200; font-size:44px; }
.xring{ position:relative; width:150px; height:150px; }
.xring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.xring circle{ fill:none; stroke-width:10; }
.xring .bg{ stroke:var(--divider); } .xring .fg{ stroke:var(--gold); stroke-linecap:round; }
.xring .v{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.xring .v b{ font-family:'Raleway',sans-serif; font-weight:300; font-size:40px; color:var(--navy-deep); line-height:1; }
.xring .v span{ font-size:11px; color:var(--slate); font-weight:600; margin-top:4px; }
.parts{ width:100%; text-align:left; }
.parts .pr{ display:grid; grid-template-columns:1fr 34px; gap:4px 10px; align-items:center; margin-bottom:10px; font-size:12.5px; }
.parts .pr .hbar{ grid-column:1/-1; height:6px; }
.social{ display:inline-flex; gap:6px; margin-left:8px; vertical-align:middle; }
.social a{ width:24px; height:24px; border-radius:50%; background:var(--bg-light); border:1px solid var(--divider); display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:var(--slate); text-decoration:none; }
.social a:hover{ color:var(--navy); border-color:var(--navy); }
.kv{ display:grid; grid-template-columns:1fr 1fr; gap:14px 20px; }
.kv div small{ display:block; font-size:11.5px; color:var(--slate); font-weight:600; }
.kv div span{ display:block; border-bottom:1px solid var(--divider); padding:4px 0 6px; font-size:13.5px; word-break:break-word; }
.minimap{ position:relative; height:220px; border-radius:14px; overflow:hidden; border:1px solid var(--divider); background:#e9eef3; }
.minimap svg{ position:absolute; inset:0; width:100%; height:100%; }
.minimap .addr{ position:absolute; left:12px; top:12px; background:#fff; color:#1d1d1f; border-radius:10px; padding:10px 12px; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,.12); max-width:240px; }
.minimap .addr b{ display:block; font-size:13px; }
.minimap .addr a{ font-weight:600; font-size:12px; }
.usmap{ width:100%; height:auto; }
.usmap path{ stroke:var(--surface); stroke-width:.8; transition:opacity .15s; }
.usmap path:hover{ opacity:.8; }
.usmap text{ font:700 10px 'Open Sans',sans-serif; fill:#12233c; paint-order:stroke; stroke:#fff; stroke-width:3px; pointer-events:none; }
.legend{ display:flex; align-items:center; gap:10px; font-size:11.5px; color:var(--slate); }
.legend .g{ width:160px; height:8px; border-radius:5px; background:linear-gradient(90deg,#e7ecf3,#335789); }
.anctl{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.types{ display:flex; flex-wrap:wrap; gap:6px; }
.linkish{ border:0; background:none; padding:0; color:var(--navy); font-weight:600; cursor:pointer; text-align:left; font-size:inherit; }
:root[data-theme="dark"] .linkish{ color:var(--navy-deep); }
.linkish:hover{ text-decoration:underline; }
.subh{ font-family:'Raleway',sans-serif; font-weight:600; font-size:16px; margin:26px 0 4px; }
.subh + .note{ margin-bottom:12px; }
@media (max-width:900px){ .prof{ grid-template-columns:1fr; } .prof .side{ position:static; } .kv{ grid-template-columns:1fr; } }

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .nav button.on, :root:not([data-theme="light"]) .tabs button.on, :root:not([data-theme="light"]) .linkish, :root:not([data-theme="light"]) .pill.blue, :root:not([data-theme="light"]) .lvl.Exclusive, :root:not([data-theme="light"]) .crumb button{ color:var(--navy-deep); } }

.av.ph{ padding:0; overflow:hidden; background:var(--divider); }
.av.ph img{ width:100%; height:100%; object-fit:cover; display:block; }
.bv{ position:relative; border:1px solid var(--divider); border-radius:18px; overflow:hidden; background:#fff; color:#1d1d1f; min-height:640px; }
.bv .chrome{ display:flex; align-items:center; gap:5px; padding:9px 14px; background:#e6e9ef; }
.bv .chrome i{ width:9px; height:9px; border-radius:50%; background:#c3c8d2; }
.bv .chrome span{ margin-left:10px; font-size:11px; color:#6b6f78; background:#fff; border-radius:10px; padding:2px 12px; }
@media (min-width:1101px){ .bv-body{ max-width:calc(100% - 400px); } }
.bv-hero{ position:relative; background:linear-gradient(120deg,#0f1c30,#25415f 55%,#33506f); color:#fff; padding:34px 36px 30px; }
.bv-hero small{ font-family:'Raleway',sans-serif; font-size:10.5px; letter-spacing:2px; font-weight:600; color:#f0c88a; }
.bv-hero h3{ font-family:'Raleway',sans-serif; font-weight:200; font-size:28px; letter-spacing:1px; text-transform:uppercase; margin-top:8px; line-height:1.15; }
.bv-hero .by{ display:inline-flex; align-items:center; gap:8px; margin-top:14px; font-size:12px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:20px; padding:4px 12px 4px 4px; }
.bv-hero .by .blogo{ width:24px; height:24px; border-radius:6px; font-size:9px; }
.bv-body{ padding:26px 36px 120px; display:grid; gap:18px; max-width:680px; }
.bv-sec h4{ font-family:'Raleway',sans-serif; font-weight:600; font-size:15px; color:#26436E; margin-bottom:6px; }
.bv-sec p{ font-size:13px; color:#55575e; line-height:1.7; }
.bv-facts{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.bv-facts div{ background:#f5f5f7; border-radius:12px; padding:10px 12px; }
.bv-facts b{ display:block; font-family:'Raleway',sans-serif; font-weight:400; font-size:17px; color:#26436E; }
.bv-facts span{ font-size:11px; color:#6e6e73; }
.bv-lock{ display:flex; align-items:center; gap:10px; background:#f5f5f7; border:1px dashed #d6d9e0; border-radius:12px; padding:12px 14px; font-size:12.5px; color:#6e6e73; }
.bv-lock svg{ color:#94691C; }
.chat{ position:absolute; right:18px; bottom:18px; width:min(360px,calc(100% - 36px)); background:#fff; color:#1d1d1f; border-radius:18px; box-shadow:0 22px 60px rgba(15,28,48,.28); border:1px solid #e6e6ea; display:flex; flex-direction:column; overflow:hidden; max-height:540px; }
.chat.min{ width:auto; }
.chat-h{ display:flex; align-items:center; gap:12px; padding:14px 16px; background:linear-gradient(120deg,#1f3a60,#335789); color:#fff; }
.chat-h .pic{ position:relative; width:42px; height:42px; border-radius:50%; overflow:hidden; border:2px solid rgba(255,255,255,.7); flex-shrink:0; background:#dfe3ea; }
.chat-h .pic img{ width:100%; height:100%; object-fit:cover; }
.chat-h .pic::after{ content:""; position:absolute; right:1px; bottom:1px; width:10px; height:10px; border-radius:50%; background:#5ec27f; border:2px solid #2a4c7c; }
.chat-h b{ display:block; font-family:'Raleway',sans-serif; font-size:14.5px; }
.chat-h span{ font-size:11.5px; opacity:.85; }
.chat-h button{ margin-left:auto; background:rgba(255,255,255,.12); border:0; color:#fff; width:32px; height:32px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.chat-h button svg{ width:14px; height:14px; }
.chat-b{ padding:14px; display:flex; flex-direction:column; gap:10px; overflow-y:auto; min-height:160px; background:#f7f8fa; }
.cm{ max-width:86%; font-size:13px; line-height:1.55; padding:9px 12px; border-radius:14px; background:#fff; border:1px solid #e6e6ea; }
.cm.me{ align-self:flex-end; background:#335789; color:#fff; border-color:#335789; }
.cm .src{ display:block; font-size:10.5px; color:#8a8a90; margin-top:5px; }
.cm .acts{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.cm .acts button{ border:1px solid #335789; background:#fff; color:#335789; border-radius:16px; padding:4px 10px; font:600 12px 'Open Sans',sans-serif; cursor:pointer; }
.cm .acts button.pri{ background:#335789; color:#fff; }
.typing{ display:inline-flex; gap:4px; } .typing i{ width:6px; height:6px; border-radius:50%; background:#aab1bd; animation:tp 1s infinite; } .typing i:nth-child(2){ animation-delay:.15s } .typing i:nth-child(3){ animation-delay:.3s }
@keyframes tp{ 50%{ opacity:.3; transform:translateY(-2px); } }
.sugg{ display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 10px; background:#f7f8fa; }
.sugg button{ border:1px solid #d6d9e0; background:#fff; border-radius:16px; padding:5px 10px; font-size:12px; cursor:pointer; color:#1d1d1f; }
.chat-f{ display:flex; gap:8px; padding:10px 12px; border-top:1px solid #e6e6ea; background:#fff; }
.chat-f input{ flex:1; border:1px solid #d6d9e0; border-radius:20px; padding:9px 14px; font-size:13px; min-height:40px; background:#fff; color:#1d1d1f; }
.chat-f button{ width:40px; height:40px; border-radius:50%; border:0; background:#335789; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.chat-f button svg{ width:16px; height:16px; }
.chat-direct{ text-align:center; font-size:11.5px; padding:0 12px 10px; background:#fff; color:#6e6e73; }
.chat-direct button{ border:0; background:none; color:#335789; font-weight:600; cursor:pointer; font-size:11.5px; padding:0; }
.launch{ position:absolute; right:18px; bottom:18px; display:flex; align-items:center; gap:10px; background:#fff; border:1px solid #e6e6ea; border-radius:30px; padding:6px 16px 6px 6px; box-shadow:0 12px 30px rgba(15,28,48,.2); cursor:pointer; font:600 13px 'Raleway',sans-serif; color:#1d1d1f; }
.launch img{ width:38px; height:38px; border-radius:50%; object-fit:cover; }
@media (max-width:900px){ .bv-facts{ grid-template-columns:repeat(2,1fr); } .bv-body{ padding:20px 18px 120px; } }


.bv-nav{ display:flex; align-items:center; gap:10px; padding:12px 24px; border-bottom:1px solid #e6e6ea; background:#fff; }
.bv-nav b{ font-family:'Raleway',sans-serif; font-size:14px; color:#1d1d1f; }
.bv-nav .links{ display:flex; gap:18px; margin-left:auto; font-size:12.5px; color:#55575e; }
.bv-nav .ph{ font-size:12.5px; font-weight:600; color:#1d1d1f; margin-left:16px; }
.bv-sec{ position:relative; border-radius:12px; }
.bv-sec.editable{ outline:1.5px dashed #E1AE53; outline-offset:6px; }
.bv-sh{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
.bv-sh h4{ margin:0; }
.bv-edit{ display:inline-flex; align-items:center; gap:6px; border:1px solid #E1AE53; background:#fbf3e3; color:#94691C; border-radius:16px; padding:4px 10px; font:600 11.5px 'Open Sans',sans-serif; cursor:pointer; }
.bv-edit svg{ width:13px; height:13px; }
.bv-video{ display:flex; align-items:center; gap:14px; border-radius:12px; padding:18px; background:linear-gradient(120deg,#1b2c44,#2f4d78); color:#fff; }
.bv-video .pb{ width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; }
.bv-video b{ display:block; font-family:'Raleway',sans-serif; } .bv-video span{ font-size:12px; opacity:.8; }
.bv-bars div{ display:grid; grid-template-columns:44px 1fr 60px; gap:10px; align-items:center; font-size:12px; color:#6e6e73; margin-bottom:6px; }
.bv-bars i{ display:block; height:10px; border-radius:6px; background:linear-gradient(90deg,#335789,#4b73aa); }
.bv-bars b{ text-align:right; color:#26436E; font-weight:600; }
.tbl.compact td{ padding:8px 14px; font-size:13px; }
.tbl.compact td.num{ white-space:nowrap; }
.tbl.compact .s{ font-size:11.5px; }
.tbl.compact .btn-sm{ min-height:28px; padding:0 10px; }
.dr > *, .grid2 > *, .grid3 > *{ min-width:0; }
.dstrip{ display:flex; flex-wrap:wrap; gap:10px 28px; align-items:center; border:1px solid var(--divider); border-radius:14px; padding:12px 18px; margin-bottom:22px; background:var(--surface); }
.dstrip span{ display:block; font-size:11px; font-weight:600; color:var(--slate); }
.dstrip b{ display:block; font-weight:600; font-size:14px; margin-top:2px; }
.iconbtn{ display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; border:1px solid var(--divider); background:var(--surface); color:var(--navy); cursor:pointer; vertical-align:middle; margin-left:6px; padding:0; }
.iconbtn:hover{ border-color:var(--navy); background:var(--navy-tint); }
.iconbtn svg{ width:14px; height:14px; }
.thread{ display:flex; flex-direction:column; gap:10px; max-height:380px; overflow-y:auto; }
.em{ border:1px solid var(--divider); border-radius:12px; padding:12px 14px; background:var(--surface); }
.em.in{ background:var(--bg-light); }
.em .eh{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--slate); }
.em .eh b{ color:var(--ink); }
.em .es{ font-weight:600; font-size:13.5px; margin-top:6px; }
.em .eb{ font-size:13px; color:var(--ink); margin-top:4px; white-space:pre-wrap; }
.dirp{ font-size:10.5px; font-weight:700; border-radius:6px; padding:1px 6px; }
.dirp.out{ background:var(--blue-soft); color:var(--navy); } .dirp.in{ background:var(--green-soft); color:var(--green); } .dirp.sys{ background:var(--amber-soft); color:var(--amber); }
.ccx{ display:flex; align-items:center; gap:10px; border:1px solid var(--divider); border-radius:12px; padding:10px 14px; background:var(--bg-light); }
.ccx img{ height:16px; }
.tnote{ border-left:3px solid var(--gold); background:var(--bg-light); border-radius:0 10px 10px 0; padding:10px 12px; }
.tnote + .tnote{ margin-top:8px; }
.tnote .nh{ font-size:11.5px; color:var(--slate); }
.tnote p{ font-size:13px; margin-top:3px; }
.agdoc{ max-height:640px; font-size:12.5px; }
.agdoc p{ margin:0 0 6px; }
.agsec{ position:relative; padding:4px 0; border-radius:8px; }
.agsec.edited{ background:#fffaf0; box-shadow:0 0 0 6px #fffaf0; }

.pipe button:hover{ border-color:var(--navy); }
.pipe b{ font-family:'Raleway',sans-serif; font-weight:300; font-size:28px; color:var(--navy-deep); line-height:1.1; }
.pipe span{ font-size:12.5px; color:var(--slate); }
.pipe i{ display:block; height:4px; border-radius:3px; background:var(--divider); margin-top:8px; overflow:hidden; }
.pipe i em{ display:block; height:100%; background:var(--gold); }

/* deal flow cards */
.dgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; }
.dcard{ border:1px solid var(--divider); border-radius:18px; overflow:hidden; background:var(--surface); display:flex; flex-direction:column; cursor:pointer; text-align:left; padding:0; }
.dcard:hover{ border-color:var(--navy); }
.dcard .ban{ height:118px; background:linear-gradient(120deg,#1f3a60,var(--navy)); background-size:cover; background-position:center; position:relative; }
.dcard .ban .pl{ position:absolute; left:12px; top:12px; display:flex; gap:6px; flex-wrap:wrap; }
.dcard .ban .ph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.55); }
.dcard .ban .ph svg{ width:34px; height:34px; }
.dcard .bd{ padding:16px 18px 18px; display:flex; flex-direction:column; gap:10px; flex:1; }
.dcard h3{ font-size:15.5px; font-weight:600; line-height:1.35; color:var(--ink); }
.dcard .meta{ font-size:12.5px; color:var(--slate); }
.dcard .kpis{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; border-top:1px solid var(--divider); padding-top:12px; margin-top:auto; }
.dcard .kpis small{ display:block; font-size:11px; color:var(--slate); }
.dcard .kpis b{ font-family:'Raleway',sans-serif; font-weight:500; font-size:16px; color:var(--navy-deep); }
.dcard .ft{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12.5px; }
.fitbar{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--slate); }
.fitbar .hbar{ height:6px; }
.toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
.toolbar .inp{ max-width:260px; }
.toolbar select.inp{ width:auto; min-width:150px; }
.toolbar .grow{ flex:1; }

/* deal detail */
.dban{ position:relative; height:170px; border-radius:20px; overflow:hidden; background:linear-gradient(120deg,#1f3a60,var(--navy)); background-size:cover; background-position:center; margin-bottom:22px; }
.dban::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(18,35,60,0) 30%,rgba(18,35,60,.7)); }
.dban .in{ position:absolute; left:26px; right:26px; bottom:18px; z-index:1; color:#fff; display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
.dban h1{ font-weight:300; font-size:28px; line-height:1.2; color:#fff; }
.dban .meta{ font-size:13px; color:rgba(255,255,255,.85); margin-top:4px; }
.factg{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
.factg div{ border:1px solid var(--divider); border-radius:14px; padding:14px 16px; background:var(--surface); }
.factg small{ display:block; font-size:11.5px; color:var(--slate); }
.factg b{ font-family:'Raleway',sans-serif; font-weight:400; font-size:20px; color:var(--navy-deep); }
.locked-box{ border:1px dashed var(--divider); border-radius:16px; padding:22px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; background:var(--bg-light); }
.locked-box .ic{ width:42px; height:42px; border-radius:12px; background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--navy); flex-shrink:0; }
.bul{ margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px; }
.bul li{ font-size:13.5px; }

/* analysis builder */
.anl{ display:grid; grid-template-columns:1.25fr 1fr; gap:22px; align-items:start; }
.anl .live{ position:sticky; top:20px; }
.anl h4{ font-family:'Raleway',sans-serif; font-weight:600; font-size:14.5px; margin:22px 0 10px; }
.anl h4:first-child{ margin-top:0; }
.fg3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.inpu{ position:relative; }
.inpu .inp{ padding-left:24px; }
.inpu .u{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--slate); font-size:13px; pointer-events:none; }
.inpu.r .inp{ padding-left:12px; padding-right:34px; }
.inpu.r .u{ left:auto; right:12px; }
.conds{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.ck{ display:flex; gap:10px; align-items:flex-start; border:1px solid var(--divider); border-radius:12px; padding:10px 12px; cursor:pointer; font-size:13px; background:var(--surface); }
.ck input{ margin-top:3px; accent-color:var(--navy); }
.ck.on{ border-color:var(--navy); background:var(--navy-tint); }
.vis{ display:flex; flex-direction:column; gap:10px; }
.vis .vrow{ display:flex; gap:14px; align-items:flex-start; justify-content:space-between; border:1px solid var(--divider); border-radius:14px; padding:12px 14px; background:var(--surface); }
.vis .vrow b{ display:block; font-size:13.5px; }
.vis .vrow span{ font-size:12.5px; color:var(--slate); }
.warn{ background:var(--amber-soft); color:var(--amber); border:1px solid rgba(178,122,18,.25); border-radius:12px; padding:9px 12px; font-size:12.5px; }
.okn{ background:var(--green-soft); color:var(--green); border-radius:12px; padding:9px 12px; font-size:12.5px; }

/* gauge + sources and uses */
.gauge{ position:relative; width:100%; max-width:300px; margin:0 auto; }
.gauge svg{ width:100%; display:block; }
.gauge .gv{ text-align:center; margin-top:6px; }
.gauge .gv b{ font-family:'Raleway',sans-serif; font-weight:300; font-size:42px; line-height:1; color:var(--navy-deep); }
.gauge .gv span{ display:block; font-size:12px; color:var(--slate); margin-top:2px; }
.su{ display:flex; height:16px; border-radius:8px; overflow:hidden; background:var(--divider); }
.su i{ display:block; height:100%; }
.su .s1{ background:var(--navy); } .su .s2{ background:var(--sky); } .su .s3{ background:var(--gold); }
.sulg{ display:grid; grid-template-columns:1fr auto auto; gap:6px 14px; margin-top:12px; font-size:13px; align-items:center; }
.sulg .sw{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:8px; vertical-align:-1px; }
.sulg .num{ text-align:right; }
.sulg .pc{ color:var(--slate); text-align:right; font-size:12px; }
.ratios{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
.ratios div{ background:var(--bg-light); border-radius:12px; padding:10px 12px; }
.ratios small{ display:block; font-size:11px; color:var(--slate); }
.ratios b{ font-family:'Raleway',sans-serif; font-weight:500; font-size:17px; color:var(--navy-deep); }
.ratios b.bad{ color:var(--red); }

/* application stepper */
.asteps{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:24px; }
.asteps div{ position:relative; padding-top:14px; font-size:12px; color:var(--muted); font-weight:600; }
.asteps div::before{ content:""; position:absolute; top:0; left:0; right:0; height:5px; border-radius:3px; background:var(--divider); }
.asteps div.done{ color:var(--slate); } .asteps div.done::before{ background:var(--navy); }
.asteps div.cur{ color:var(--navy); } .asteps div.cur::before{ background:var(--gold); }
.asteps.dec div.cur{ color:var(--red); } .asteps.dec div.cur::before{ background:var(--red); }
.cmp{ width:100%; border-collapse:collapse; font-size:13.5px; }
.cmp th{ text-align:right; font-size:11.5px; color:var(--slate); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--divider); }
.cmp th:first-child,.cmp td:first-child{ text-align:left; }
.cmp td{ padding:10px; border-bottom:1px solid var(--divider); text-align:right; font-variant-numeric:tabular-nums; }
.cmp tr:last-child td{ border-bottom:0; }
.cmp td.diff{ color:var(--amber); font-weight:600; }
.docrow{ display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--divider); }
.docrow:first-child{ border-top:0; }
.docrow .t{ font-size:13.5px; font-weight:600; }
.docrow .s{ font-size:12px; color:var(--slate); }
.docrow .end{ margin-left:auto; display:flex; gap:8px; align-items:center; }
.vbadges{ display:flex; flex-wrap:wrap; gap:6px; }
.thread{ display:flex; flex-direction:column; gap:10px; max-height:320px; overflow-y:auto; margin-bottom:12px; }
.msg{ color:var(--ink); max-width:86%; border-radius:14px; padding:10px 12px; font-size:13px; background:var(--bg-light); }
.msg.me{ align-self:flex-end; background:var(--navy-tint); color:var(--ink); }
.msg small{ display:block; font-size:11px; color:var(--slate); margin-bottom:2px; font-weight:600; }
.mini-score{ display:flex; align-items:center; gap:12px; }
.mini-score .ring{ position:relative; width:58px; height:58px; }
.mini-score .ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.mini-score .ring circle{ fill:none; stroke-width:6; }
.mini-score .ring .bg{ stroke:var(--divider); } .mini-score .ring .fg{ stroke:var(--gold); stroke-linecap:round; }
.mini-score .ring b{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Raleway',sans-serif; font-weight:500; font-size:17px; color:var(--navy-deep); }

/* letter */
.lbuild{ display:grid; grid-template-columns:360px 1fr; gap:0; min-height:520px; }
.lbuild .lf{ padding:20px 22px; border-right:1px solid var(--divider); display:flex; flex-direction:column; gap:12px; overflow-y:auto; max-height:calc(100vh - 220px); }

.paper .lh{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid #1f5c63; padding-bottom:14px; margin-bottom:22px; }
.paper .lh .bk{ display:flex; gap:10px; align-items:center; }

.paper .lh .bk b{ font-family:'Raleway',sans-serif; font-size:16px; color:#1f5c63; display:block; }
.paper .lh .bk small{ font-family:'Open Sans',sans-serif; font-size:11px; color:#6e6e73; }
.paper .lh .ad{ font-family:'Open Sans',sans-serif; font-size:11px; color:#6e6e73; text-align:right; line-height:1.5; }
.paper h2{ font-family:Georgia,serif; font-size:17px; font-weight:700; margin:16px 0 10px; color:#12233c; }
.paper p{ margin:0 0 10px; }
.paper table{ width:100%; border-collapse:collapse; margin:8px 0 14px; font-size:13px; }
.paper td{ padding:6px 0; border-bottom:1px solid #eee; }
.paper td:last-child{ text-align:right; font-weight:700; }
.paper ol{ margin:6px 0 12px; padding-left:20px; }
.paper .sig{ margin-top:26px; }
.paper .sig .sn{ font-family:'Brush Script MT','Snell Roundhand',cursive; font-size:26px; color:#26436e; line-height:1; }
.paper .stamp{ display:inline-block; margin-top:4px; font-family:'Open Sans',sans-serif; font-size:10.5px; color:#2f8f57; border:1px solid #2f8f57; border-radius:20px; padding:1px 8px; }
@media (max-width:1100px){ .anl{ grid-template-columns:1fr; } .anl .live{ position:static; } .pipe{ grid-template-columns:repeat(3,1fr); } .factg{ grid-template-columns:repeat(2,1fr); } }

 return {loan:loan,sn:sn,eq:eq,eqPct:price?eq/price*100:0,ds:ds,snDs:snDs,dscr:ds?cfads/ds:0,tdscr:(ds+snDs)?cfads/(ds+snDs):0,lev:x.ebitda?loan/x.ebitda:0,ltp:price?loan/price*100:0,cfads:cfads};

document.addEventListener('click',function(e){
 var t=e.target.closest('[data-go],[data-act],[data-tab],[data-fset],[data-appf],[data-tog],[data-chip],[data-ctog]'); if(!t) return;

 if(t.dataset.tab&&!t.dataset.act){ U.tab=t.dataset.tab; render(); return; }
 if(t.dataset.fset){ U.filt[t.dataset.fset]=t.dataset.v; render(); return; }
 if(t.dataset.appf){ U.appFilt=t.dataset.appf; render(); return; }
 if(t.dataset.tog){ var k=t.dataset.tog; U.draft[k]=!U.draft[k]; t.setAttribute('aria-checked',U.draft[k]); return; }

 if(t.dataset.chip){ var arr=S.crit[t.dataset.chip], v=t.dataset.v, i=arr.indexOf(v); if(i>-1) arr.splice(i,1); else arr.push(v); save(); render(); return; }
 var act=t.dataset.act, id=t.dataset.id;

 if(act==='viewfile'||act==='dlfile'){ toast((act==='viewfile'?'Opening ':'Downloading ')+t.dataset.n+'. Your access is logged.'); return; }

  ap6.letter=L; ap6.status='approved'; ap6.msgs.push({from:S.lender.contact,me:true,at:L.at,t:'Your financing approval letter is ready in your Exio dashboard.'});

  save(); $('#modal').close(); render(); toast('Approval letter sent. It now shows in '+ap6.buyer+'’s buyer dashboard.'); return; }

 if(act==='readall'){ S.inbox.forEach(function(n){n.read=true;}); save(); render(); return; }

 if(act==='invite'){ confirmModal('Invite a colleague','<div class="fg"><div class="fld"><label for="tn">Name</label><input class="inp" id="tn"></div><div class="fld"><label for="te">Email</label><input class="inp" id="te" type="email"></div><div class="fld full"><label for="tp">Permissions</label><select class="inp" id="tp"><option>Analyze and review</option><option>Approve and sign letters</option><option>Full access</option><option>View only</option></select></div></div>','Send invite',function(){ var nm=$('#tn').value.trim(), em=$('#te').value.trim(); if(!nm||!em){ toast('Add a name and email'); return false; } S.team.push({id:uid('t'),name:nm,email:em,role:'Team member',perm:$('#tp').value,status:'Invited'}); save(); render(); toast('Invite sent to '+em); }); return; }
});
